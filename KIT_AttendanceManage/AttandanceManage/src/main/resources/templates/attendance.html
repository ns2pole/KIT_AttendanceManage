<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤怠入力</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}" />
</head>
<body>
    <div class="container">
        <h1 th:text="${message}"></h1>
        <h2>勤怠入力</h2>

        <div id="userInfo">
            <p>名前: <span id="usernameDisplay">ユーザー名</span></p>
            <p id="status">未出勤</p>
            <p id="currentTime"></p>
        </div>
        
        <!-- 勤務地選択 -->
        <label for="workplaceSelect">勤務地:</label>
        <select id="workplaceSelect">
            <option value="">選択してください</option>
            <!-- 勤務地の選択肢はJavaScriptで追加 -->
        </select>
        
        <button id="checkIn">出勤</button>
        <button id="checkOut">退勤</button>
        <button id="startBreak">休憩</button>
        <button id="endBreak">休憩終了</button>


        <h3>リンク</h3>
        <div class="button-container">
            <a class="button" href="attendance">勤怠入力</a>
            <a class="button" href="workplace">勤務場所登録</a>
            <a class="button" href="contact">連絡先登録</a>
            <a class="button" href="history">勤怠状況一覧表示</a>
            <a class="button" href="status">勤怠状況一覧</a>
            <a class="button" href="leave-application">有給申請</a>
            <a class="button" href="leave-approval">有給申請承諾・却下</a>
            <a class="button" href="login">ログアウト</a>
        </div>
    </div>

    <script>
        // ユーザー名の表示
        document.getElementById('usernameDisplay').textContent = localStorage.getItem('username');


        function updateCurrentTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = `現在の時刻: ${now.toLocaleString()}`;
        }
        updateCurrentTime();
        setInterval(updateCurrentTime, 1000);

        // 勤務地の選択肢を追加する処理
        const workplaces = JSON.parse(localStorage.getItem('workplaces')) || [];
        const workplaceSelect = document.getElementById('workplaceSelect');
        workplaces.forEach(function(workplace) {
            const option = document.createElement('option');
            option.value = workplace;
            option.textContent = workplace;
            workplaceSelect.appendChild(option);
        });

        // 出勤ボタンの処理
        document.getElementById('checkIn').addEventListener('click', function() {
            const status = document.getElementById('status');
                const workplaceSelect = document.getElementById('workplaceSelect');
               const currentTime = new Date().toISOString();
            if (workplaceSelect.value) {
                    fetch('/api/attendance/checkIn', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },

            body: JSON.stringify({ workplace: workplaceSelect.value,
               checkInTime: currentTime,
             }),
        })

                alert(`出勤しますか？ 勤務地: ${workplaceSelect.value}`);
                status.textContent = '出勤済み';
            } else {
                alert('勤務地を選択してください。');
            }
        });

        // 退勤ボタンの処理
       document.getElementById('checkOut').addEventListener('click', function() {
          const status = document.getElementById('status');
    const workplaceSelect = document.getElementById('workplaceSelect');
    const currentTime = new Date().toISOString(); // 退勤時刻の取得

    if (workplaceSelect.value) {
        // 退勤のAPIにPOSTリクエストを送る
        fetch('/api/attendance/checkOut', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                workplace: workplaceSelect.value,
                checkOutTime: currentTime, // 退勤時刻
            })
        })
        .then(response => response.json()) // レスポンスをJSONとしてパース
        .then(data => {
            if (data.success) {
                // 退勤処理成功後のステータス更新
                alert(`退勤しますか？ 勤務地: ${workplaceSelect.value}`);
                status.textContent = '退勤済み';  // ステータスを退勤済みに変更
            } else {
                alert(data.message || '退勤処理に失敗しました。');
            }
        })
        .catch(error => {
            console.error('退勤処理中にエラーが発生しました:', error);
            alert('退勤処理に失敗しました。');
        });
    } else {
        alert('勤務地を選択してください。');
    }
});
        document.getElementById('startBreak').addEventListener('click', function () {
    const currentTime = new Date().toISOString(); // 現在時刻を取得
    fetch('/api/attendance/startBreak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ breakStartTime: currentTime })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            document.getElementById('status').textContent = '休憩中'; // 状態を更新
            alert('休憩を開始しました。');
        } else {
            alert(data.message || '休憩開始処理に失敗しました。');
        }
    })
    .catch(error => {
        console.error('休憩開始処理中にエラーが発生しました:', error);
        alert('休憩開始処理に失敗しました。');
    });
});

document.getElementById('endBreak').addEventListener('click', function () {
    const currentTime = new Date().toISOString(); // 現在時刻を取得
    fetch('/api/attendance/endBreak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ breakEndTime: currentTime })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            document.getElementById('status').textContent = '勤務中'; // 状態を更新
            alert('休憩を終了しました。');
        } else {
            alert(data.message || '休憩終了処理に失敗しました。');
        }
    })
    .catch(error => {
        console.error('休憩終了処理中にエラーが発生しました:', error);
        alert('休憩終了処理に失敗しました。');
    });
});

    </script>
